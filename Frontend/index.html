<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Message Hub</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- React (UMD builds) and Babel, so JSX runs in the browser without a build step. -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

</head>
<body>
  <div id="root"></div>

  <!-- Page-specific JSX. Shared code (Firebase, API, header/footer) lives in shared.js. -->
  <script type="text/babel" data-type="module" data-presets="react">
    import { login, logout as firebaseLogout, loginErrorMessage, apiRequest,
             readSetting, writeSetting, TOKEN_KEY, Header, Footer } from "./shared.js";

    const { useState, useEffect } = React;

    const EVENT_TYPES = ["Announcement", "Reminder", "Alert"];

    // Shown when the API can't be reached or no token is set, so the page still demonstrates the flow.
    const SAMPLE_GROUPS = [
      { id: "g1", groupName: "Volunteers", groupType: "Community", groupColorCode: "#2F6FDF", members: ["c1", "c2", "c3"] },
      { id: "g2", groupName: "Board Members", groupType: "Internal", groupColorCode: "#1F8A4C", members: ["c4", "c5"] },
      { id: "g3", groupName: "Parents", groupType: "School", groupColorCode: "#C4352B", members: ["c6", "c7", "c8", "c9"] },
    ];

    const SAMPLE_EVENTS = [
      { id: "e1", eventType: "Reminder", eventTitle: "Saturday clean-up", eventText: "Meet at the park entrance at 9am. Gloves provided.", groups: ["g1"], createdAt: "2026-10-01T14:30:00Z" },
      { id: "e2", eventType: "Announcement", eventTitle: "Quarterly meeting moved", eventText: "The meeting is now on Thursday at 6pm in room B.", groups: ["g2"], createdAt: "2026-09-28T09:15:00Z" },
    ];

    function Connection({ onLogin }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState(null);
      const [loggingIn, setLoggingIn] = useState(false);

      async function handleSubmit(e) {
        e.preventDefault();               // stop the browser reloading the page
        setError(null);
        setLoggingIn(true);

        try {
            const token = await login(email.trim(), password);
            setPassword("");
            onLogin(token); // hand the token up to App
          } catch (err) {
              setError(loginErrorMessage(err));
          } finally {
              setLoggingIn(false);
          }
      }

        return (
          <details className="connection card" style={{ marginBottom: 24 }} open>
            <summary>App Login</summary>
            <form className="fields" onSubmit={handleSubmit}>
              <div>
                <label htmlFor="email">Email</label>
                <input id="email" type="email" required autoComplete="username"
                      value={email} onChange={e => setEmail(e.target.value)} />
              </div>
              <div>
                <label htmlFor="password">Password</label>
                <input id="password" type="password" required autoComplete="current-password"
                      value={password} onChange={e => setPassword(e.target.value)} />
              </div>
              <button type="submit" disabled={loggingIn}>{loggingIn ? "Logging in…" : "Login"}</button>
            </form>
            {error && <p className="status-error" role="alert">{error}</p>}
          </details>
        );
    }

    function GroupsSection({ groups }) {
      return (
        <section id="groups">
          <h2>Groups</h2>
          <p className="section-intro">Clients are organised into groups. Every event is delivered to the members of its groups.</p>

          {groups.length === 0 ? (
            <p className="empty">No groups yet.</p>
          ) : (
            <div className="grid">
              {groups.map(group => (
                <article key={group.id} className="card group-card">
                  <h3>
                    <span className="swatch" style={{ background: group.groupColorCode || "transparent" }} />
                    {group.groupName}
                  </h3>
                  <p className="meta">
                    {group.groupType || "General"} · {group.members.length} {group.members.length === 1 ? "member" : "members"}
                  </p>
                </article>
              ))}
            </div>
          )}
        </section>
      );
    }

    function EventsSection({ events, groups }) {
      const groupName = id => groups.find(g => g.id === id)?.groupName ?? "Unknown group";
      const sorted = [...events].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      return (
        <section id="events">
          <h2>Events</h2>
          <p className="section-intro">Each event becomes a notification for every member of its groups.</p>

          {sorted.length === 0 ? (
            <p className="empty">No events yet.</p>
          ) : (
            <div className="event-list">
              {sorted.map(event => (
                <article key={event.id} className="card event-card">
                  <header>
                    <h3>{event.eventTitle}</h3>
                    <span className="meta">{new Date(event.createdAt).toLocaleString()}</span>
                  </header>
                  <p>{event.eventText}</p>
                  <div>
                    <span className="tag">{event.eventType}</span>
                    {event.groups.map(id => <span key={id} className="tag">{groupName(id)}</span>)}
                  </div>
                </article>
              ))}
            </div>
          )}
        </section>
      );
    }

    function CreateEventForm({ groups, onCreate }) {
      const emptyForm = { groupId: "", eventType: EVENT_TYPES[0], eventTitle: "", eventText: "" };
      const [form, setForm] = useState(emptyForm);
      const [status, setStatus] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      const update = field => e => setForm({ ...form, [field]: e.target.value });

      async function handleSubmit(e) {
        e.preventDefault();
        setSubmitting(true);
        setStatus(null);

        try {
          await onCreate({
            eventType: form.eventType,
            eventTitle: form.eventTitle.trim(),
            eventText: form.eventText.trim(),
            groups: [form.groupId],
          });
          setForm(emptyForm);
          setStatus({ type: "success", text: "Event created. Members of the group will be notified." });
        } catch (err) {
          setStatus({ type: "error", text: `Could not create the event: ${err.message}` });
        } finally {
          setSubmitting(false);
        }
      }

      return (
        <section id="new-event">
          <h2>Create an event</h2>
          <p className="section-intro">Pick a group and write the message its members should receive.</p>

          <form className="card event-form" onSubmit={handleSubmit}>
            <div>
              <label htmlFor="group">Group of clients</label>
              <select id="group" required value={form.groupId} onChange={update("groupId")}>
                <option value="" disabled>Select a group…</option>
                {groups.map(group => (
                  <option key={group.id} value={group.id}>
                    {group.groupName} ({group.members.length})
                  </option>
                ))}
              </select>
            </div>

            <div>
              <label htmlFor="type">Type</label>
              <select id="type" value={form.eventType} onChange={update("eventType")}>
                {EVENT_TYPES.map(type => <option key={type}>{type}</option>)}
              </select>
            </div>

            <div className="full">
              <label htmlFor="title">Title</label>
              <input id="title" required maxLength={100} value={form.eventTitle} onChange={update("eventTitle")}
                     placeholder="e.g. Saturday clean-up" />
            </div>

            <div className="full">
              <label htmlFor="text">Message</label>
              <textarea id="text" required maxLength={200} value={form.eventText} onChange={update("eventText")}
                        placeholder="What should group members know?" />
              <div className="hint">{form.eventText.length}/200</div>
            </div>

            <div className="full form-actions">
              <button type="submit" disabled={submitting}>{submitting ? "Creating…" : "Create event"}</button>
              {status && <span className={`status-${status.type}`} role="status">{status.text}</span>}
            </div>
          </form>
        </section>
      );
    }

    function App() {
      const [token, setToken] = useState(() => readSetting(TOKEN_KEY, ""));
      const [groups, setGroups] = useState([]);
      const [events, setEvents] = useState([]);
      const [demoReason, setDemoReason] = useState(null);

      useEffect(() => {
        let cancelled = false;

        async function load() {
          if (!token) {
            showSampleData("Login before working with the app.");
            return;
          }
          try {
            const [g, e] = await Promise.all([
              apiRequest(token, "/api/groups"),
              apiRequest(token, "/api/events"),
            ]);
            if (cancelled) return;
            setGroups(g);
            setEvents(e);
            setDemoReason(null);
          } catch (err) {
            if (!cancelled) showSampleData(`Couldn't reach the API (${err.message}), so sample data is shown.`);
          }
        }

        function showSampleData(reason) {
          setGroups(SAMPLE_GROUPS);
          setEvents(SAMPLE_EVENTS);
          setDemoReason(reason);
        }

        load();
        return () => { cancelled = true; };
      }, [token]);

        function saveToken(newToken) {
            writeSetting(TOKEN_KEY, newToken);
            setToken(newToken);   // the token changes, so useEffect runs again and loads real data
        }

        async function logout() {
            await firebaseLogout();
            saveToken("");
        }

        async function createEvent(request) {
            if (demoReason) {
            // Sample mode: keep the event in the page only.
            setEvents(prev => [...prev, { ...request, id: crypto.randomUUID(), createdAt: new Date().toISOString() }]);
            return;
            }
            const created = await apiRequest(token, "/api/events", {
                method: "POST",
                body: JSON.stringify(request),
            });
            setEvents(prev => [...prev, created]);
        }

      return (
        <>
          <Header />
          <main className="container">
            {demoReason && <div className="banner">{demoReason}</div>}
            {token ? 
                <div className="form-actions" style={{ marginBottom: 24 }}> 
                    <span className="meta">You're logged in</span>
                    <button type="button" onClick={logout}>Log out</button>
                </div>
                : <Connection onLogin={saveToken} />
            }   
            <GroupsSection groups={groups} />
            <EventsSection events={events} groups={groups} />
            <CreateEventForm groups={groups} onCreate={createEvent} />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
